name: tests

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  tests:
    # the text-only install: the voice group is Apple Silicon only, and its tests skip without it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-group voice
      - run: uv run --no-group voice python -m unittest
